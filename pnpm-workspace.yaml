# Build scripts are denied by default; an unlisted package counts as unreviewed.
# `allowBuilds` is the only spelling pnpm 11 reads: onlyBuiltDependencies,
# neverBuiltDependencies and their siblings were removed in v11 and replaced by
# this map. Without an entry, `pnpm install` exits with ERR_PNPM_IGNORED_BUILDS
# rather than warning.
allowBuilds:
  esbuild: true
  unrs-resolver: true

# Forced versions for vulnerable transitive dev dependencies. These live here and
# NOT in package.json: pnpm 11 no longer reads the `pnpm` field of package.json, so
# an override placed there does nothing — it warns, but it does nothing.
overrides:
  # GHSA-5p4m-2wfm-xmqj (CVSS 7.5) — quadratic CPU while resolving !!omap.
  # Transitive and build-time only; patched rather than ignored, because a
  # scanner told to skip dev dependencies stays blind after this one is gone.
  'js-yaml@3': '^3.15.1'
  'js-yaml@4': '^4.3.1'
  'brace-expansion@1': '^1.1.18'
  'brace-expansion@2': '^2.1.4'
  'brace-expansion@5': '^5.0.9'
  'esbuild': '^0.28.1'
  # Floors RAISED, not new entries — and the previous values are why raising them is
  # needed rather than redundant. `^3.1.5` and `^6.15.3` already admitted the fixed
  # versions, but a caret in an override is a floor on the past, not a ceiling on the
  # future: nothing re-resolves a lockfile that already satisfies the range. When
  # deciding whether a package is patched, read the resolved version in
  # pnpm-lock.yaml, never the range here.
  #
  # fast-uri: GHSA-jqff-g426-hqxp — host confusion via skipped IDN canonicalisation.
  # Introduced 3.0.0, fixed 3.1.6 (read from the OSV API); the lockfile held 3.1.5.
  # Reached through ajv, under @stryker-mutator/core and @commitlint/config-validator.
  'fast-uri': '^3.1.6'
  # qs: GHSA-x5fp-wj9c-mxmx — denial of service via an attacker-controlled isBuffer.
  # Introduced 6.14.2, fixed 6.16.0; the lockfile held 6.15.3. Reached through express
  # under @nestjs/platform-express, through supertest, and through typed-rest-client
  # under @stryker-mutator/core.
  #
  # Both are devDependency-only here: `dependencies` is empty and `files` ships dist,
  # LICENSE, README.md and CHANGELOG.md, so no consumer of the published package is
  # reachable through either. Build-surface exposure, patched because a compromised
  # build environment is real — not because a consumer is at risk.
  'qs': '^6.16.0'
