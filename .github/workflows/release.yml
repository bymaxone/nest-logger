name: Release

# Tag-driven release. Pushing a `v*.*.*` tag kicks off the publish flow; the
# `workflow_dispatch` trigger is kept so an interrupted release can be re-run
# manually from the Actions tab when needed.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

# A release is a destructive, shared-state operation — only one at a time.
concurrency:
  group: release
  cancel-in-progress: false

# Default to read-only at the workflow level. The publish job widens to
# `contents: write` (for the GitHub Release) and `id-token: write` (for
# the OIDC trusted publisher exchange).
permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm and create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The `npm-publish` environment gates the run behind a manual approval
    # (configured in repo Settings → Environments). Even an accidentally
    # pushed tag cannot publish without a reviewer clicking "Approve".
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@bymax-one/nest-logger

    # Required for npm OIDC trusted publishing (`id-token: write`) and for
    # `gh release create` (`contents: write`). No `NPM_TOKEN` secret needed —
    # the publish exchanges the GitHub OIDC token for a short-lived npm
    # credential via the Trusted Publisher configured on npmjs.com.
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.8.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        # Guards against publishing a tag whose semver does not match the
        # version committed to package.json — a mismatch always indicates
        # a broken release and would otherwise ship the wrong metadata.
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Verify (typecheck · lint · test · build)
        run: pnpm prepublishOnly

      - name: Verify published type resolution
        # Runs after the build inside prepublishOnly and before the publish, so
        # a tag cannot ship a tarball whose `exports` map resolves to
        # declarations for the wrong module format. It cannot live in
        # prepublishOnly itself: attw packs the tarball, and the nested pack
        # inside `pnpm publish` resolves to a path that does not exist.
        #
        # `check:published` needs no equivalent step: it packs nothing, so it
        # lives in prepublishOnly and already ran there. Repeating it here would
        # re-probe every README link and recompile the snippets for no new
        # information, adding time and one more chance of a network flake to the
        # one job that must not fail spuriously.
        run: pnpm check:exports

      - name: Release-shape gates (bundle size + dogfood smoke test)
        # `prepublishOnly` runs typecheck/lint/tests/build but not these, and a
        # tag is the only path that publishes from CI. The size budget stops a
        # release that silently doubled the bundle; the dogfood smoke is the only
        # gate that resolves the packed tarball from a real consumer in ESM and
        # CJS, which is what catches a DI or `exports` defect the source-based
        # suite cannot see. Both scripts already existed here and simply were
        # never wired into the publish path.
        run: |
          pnpm size
          node scripts/dogfood-smoke-test.mjs

      - name: Publish to npm with provenance
        # `npm publish`, not `pnpm publish`: the registry's `readme` field is
        # populated from the publish request, and pnpm 11 does not send it. Every
        # package here published under pnpm 11 landed with an empty `readme` — the
        # npm page rendering no documentation at all — while every one published
        # under pnpm 10, which delegated to the npm CLI, carries it. Confirmed on
        # nest-realtime@1.0.1, where switching restored both `readme` and
        # `_npmVersion` in a single release.
        #
        # OIDC trusted publishing still authenticates: the npm CLI exchanges
        # the GitHub OIDC token (`id-token: write` above) for a short-lived
        # publish credential. npm runs no git checks, so the detached HEAD the
        # runner sits on at the tag SHA needs no flag of its own.
        # Skips gracefully when the version was already published manually
        # (e.g. during the bootstrap of the first release).
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@bymax-one/nest-logger@${PKG_VERSION}" version 2>/dev/null | grep -qF "$PKG_VERSION"; then
            echo "Version ${PKG_VERSION} already published on npm — skipping publish step."
          else
            npm publish --provenance --access public
          fi

      - name: Extract release notes from CHANGELOG
        # Pulls the section for the current tag out of CHANGELOG.md so the
        # GitHub Release body stays in sync with the changelog. Falls back
        # to "See CHANGELOG.md" when the section is not found.
        id: changelog
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found=1; next }
            }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](./CHANGELOG.md) for details."
          fi
          {
            echo 'notes<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        # Notes are passed via env var (NOT `${{ ... }}` interpolation) so that
        # backticks, `$()`, and other shell metacharacters inside the CHANGELOG
        # cannot be evaluated by bash — a script-injection vector that would
        # otherwise let CHANGELOG content execute arbitrary commands on the
        # runner with the same token scope as this job.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "$RELEASE_NOTES"
