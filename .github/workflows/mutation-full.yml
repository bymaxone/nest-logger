# The full cold mutation run. The logic lives once in `bymaxone/.github`; what stays here is
# what is genuinely local: when it runs and how long it may take.
#
# Why it exists: `stryker.config.json` sets `incremental: true`, so the per-push job re-tests
# only what changed and finishes inside the minutes a routine gate is allowed to take. That is a
# trade — an incremental run reuses stored verdicts, and reused verdicts for STATIC mutants can
# be stale. The fast signal is here every push; the truth is measured cold, once a week.
name: Mutation (full)

on:
  schedule:
    # Off the working day, and staggered against the other libraries so a Monday morning does
    # not start ten cold suites at once.
    - cron: '43 4 * * 1'
  workflow_dispatch:

# Single-flight across the whole repository, deliberately NOT keyed by `github.ref`
# — the same reasoning `peer-advisory-drift.yml` here already carries. What two runs
# would race over is one shared incremental baseline, so a ref-scoped group would put
# a dispatch and the scheduled run in different groups and leave the race intact.
# Queue rather than cancel: a cold run killed halfway leaves no baseline at all,
# which is worse than a second run waiting for the first.
concurrency:
  group: mutation-full
  cancel-in-progress: false

permissions:
  contents: read
  # The reusable reads `gh run list` to decide whether anything can have moved the score.
  actions: read

jobs:
  full:
    uses: bymaxone/.github/.github/workflows/mutation-full.yml@v1
    with:
      # The ceiling is per shard job. Run 44084298228, on eight shards, took between 11 and 26 minutes
      # for them, the slowest 25.8, so 60 is 2.3 times that; run 44074911481, on four shards, took 37
      # minutes for its slowest. A run the ceiling cancels leaves no score and no baseline for the week,
      # and nothing blocks on this job, so an over-wide ceiling costs only the minutes it uses.
      timeout-minutes: 60
      # A unit test the cold run did not run fails the job. The specs that judge no mutant are
      # listed, with the reason, in scripts/mutation-inventory.exempt.json.
      inventory: enforce
      # Eight shards of two workers each. Run 44084298228 restarted a Stryker test runner that ran out of
      # memory seven times: once in each of shards 2, 3 and 4, four times in shard 6 and not at all in the
      # others, with 303 to 324 mutants in the first three and 897 in shard 6, because the plan weights
      # shards by test executions and not by mutants. Peak memory on the 16 GB runner was 10.7 GiB with two
      # workers and their parent, which points to a worker's own heap filling and not to the runner.
      # `maxTestRunnerReuse` in stryker.config.json restarts a worker after that many runs, which bounds how
      # many runs one heap serves; it applies to the per-push incremental job and to local runs as well, and
      # whether it removes the restarts is measured by the first run after it merges. The count and the
      # concurrency are passed here, not written into stryker.config.json, which those runs share.
      shards: 8
      concurrency: 2
