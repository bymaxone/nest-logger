# The full cold mutation run. The logic lives once in `bymaxone/.github`; what stays here is
# what is genuinely local: when it runs and how long it may take.
#
# Why it exists: `stryker.config.json` sets `incremental: true`, so the per-push job re-tests
# only what changed and finishes inside the minutes a routine gate is allowed to take. That is a
# trade — an incremental run reuses stored verdicts, and reused verdicts for STATIC mutants can
# be stale. The fast signal is here every push; the truth is measured cold, once a week.
name: Mutation (full)

on:
  schedule:
    # Off the working day, and staggered against the other libraries so a Monday morning does
    # not start ten cold suites at once.
    - cron: '43 4 * * 1'
  workflow_dispatch:

# Single-flight across the whole repository, deliberately NOT keyed by `github.ref`
# — the same reasoning `peer-advisory-drift.yml` here already carries. What two runs
# would race over is one shared incremental baseline, so a ref-scoped group would put
# a dispatch and the scheduled run in different groups and leave the race intact.
# Queue rather than cancel: a cold run killed halfway leaves no baseline at all,
# which is worse than a second run waiting for the first.
concurrency:
  group: mutation-full
  cancel-in-progress: false

permissions:
  contents: read
  # The reusable reads `gh run list` to decide whether anything can have moved the score.
  actions: read

jobs:
  full:
    uses: bymaxone/.github/.github/workflows/mutation-full.yml@v1
    with:
      # The ceiling is per shard job. Run 44096688399, on eight shards, took between 9.6 and 31.7 minutes
      # for them, the slowest 31.7. Run 44819362291, on the same eight shards, took between 14 and 51
      # minutes, the slowest 51 (shard 5), so 60 left 1.2 times the slowest and 77 leaves 1.5 times it (76.5). A
      # run the ceiling cancels leaves no score and no baseline for the week, and nothing blocks on this
      # job, so an over-wide ceiling costs only the minutes it uses.
      timeout-minutes: 77
      # A unit test the cold run did not run fails the job. The specs that judge no mutant are
      # listed, with the reason, in scripts/mutation-inventory.exempt.json.
      inventory: enforce
      # Eight shards of two workers each. A Stryker test runner ran out of memory and was restarted seven
      # times in run 44084298228 (once in each of shards 2, 3 and 4, four times in shard 6) and four times in
      # run 44096688399 (three in shard 4, one in shard 8). A restart reruns the mutants in flight, and
      # both runs finished every shard, so the restarts are accepted. Mutants per shard range from 234 to 946,
      # because the plan weights shards by test executions and not by mutants. Peak memory on the 16 GB
      # runner was 10.7 GiB with two workers and their parent, which points to a worker's own heap filling
      # and not to the runner. Run 44096688399 set `maxTestRunnerReuse` to 50: shard 6 went from 25.8 to 14.0
      # minutes and from four restarts to none, and the single-file shard went from 24.1 to 31.7 minutes, so
      # the option is not set. The shard count and the concurrency are passed here, not written into
      # stryker.config.json, which the per-push incremental job and local runs share.
      shards: 8
      concurrency: 2
