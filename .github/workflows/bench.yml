name: Bench

# Performance regression gate. Runs the throughput/allocation benchmark on every
# PR and fails the job on a budget regression (see bench/throughput.bench.ts).
#
# PR-only by design: a perf microbenchmark is noisy run-to-run, so gating it on
# every push to main would produce false alarms. On a PR it compares the proposed
# change against the committed budgets and blocks a genuine regression.
#
# This gate exists for nest-logger specifically because a logger's hot path is a
# core product attribute (Pino is chosen for speed); libraries whose cost is
# I/O-bound (e.g. auth) do not need it.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bench:
    name: Throughput & allocation budget
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run throughput benchmark (fails on budget regression)
        # `pnpm bench` exits 1 when allocation or throughput regresses past the
        # documented budget. See bench/README.md for the budgets and how to
        # interpret / recalibrate a regression.
        run: pnpm bench
