# Audits the dependency ranges this package DECLARES, which is a different
# question from the one Dependabot answers. Dependabot looks at what is
# installed here — the lockfile, our own devDependencies — and stays quiet as
# long as that is current. It never looks at what consumers are told they can
# install: a `peerDependencies` floor below a published advisory says a
# vulnerable install is supported, and the consumer resolving that range is
# free to pick the low end.
#
# Scheduled rather than event-driven because the declared range never changes
# and becomes wrong anyway — the advisory database is what moves. A range that
# was clean when it was written starts admitting a vulnerable version the day a
# new advisory is published, with no commit and no alert to notice.
name: peer-advisory-drift

on:
  schedule:
    # Weekly, Monday morning UTC. Off the hour: scheduled runs cluster at :00
    # and GitHub delays them under load.
    - cron: '17 6 * * 1'
  workflow_dispatch:

# `issues: write` lets the check file and close its own tracking issue.
# Permissions on a reusable workflow can only narrow what the caller grants, so
# this has to be declared here as well as there.
permissions:
  contents: read
  issues: write

jobs:
  drift:
    uses: bymaxone/.github/.github/workflows/peer-advisory-drift.yml@v1
